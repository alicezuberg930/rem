name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run React tests
        working-directory: apps/web
        run: bun run test

      - name: Build and type-check React app
        working-directory: apps/web
        run: bun run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: rem-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rem_test
          MYSQL_USER: rem_ci
          MYSQL_PASSWORD: rem_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: rem_test
      MYSQL_USER: rem_ci
      MYSQL_PASSWORD: rem_ci_password
      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/rem_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-characters
      ACCESS_TOKEN_EXPIRES_IN: 3600
      REFRESH_TOKEN_EXPIRES_IN: 604800
      WEB_PUSH_PUBLIC_KEY: ""
      WEB_PUSH_PRIVATE_KEY: ""
      WEB_PUSH_SUBJECT: ""
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci_twilio_auth_token
      TWILIO_PHONE_NUMBER: "+10000000000"
      VONAGE_API_KEY: ci_vonage_key
      VONAGE_API_SECRET: ci_vonage_secret
      VONAGE_FROM: REM
      CLOUDINARY_CLOUD_NAME: ci-cloud
      CLOUDINARY_API_KEY: ci-cloudinary-key
      CLOUDINARY_API_SECRET: ci-cloudinary-secret
      RESEND_API_KEY: ci-resend-key
      RESEND_EMAIL: ci@example.com
      SPRING_MAIL_HOST: localhost
      SPRING_MAIL_PORT: 1025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: rem-server/pom.xml

      - name: Make Maven wrapper executable
        working-directory: rem-server
        run: chmod +x mvnw

      - name: Run server tests and package
        working-directory: rem-server
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload server test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-server-test-reports
          path: rem-server/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: rem-server
          path: |
            rem-server/target/*.jar
            !rem-server/target/*.jar.original
          if-no-files-found: error
          retention-days: 7
